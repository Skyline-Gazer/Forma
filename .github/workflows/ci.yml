name: CI

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

# Fixed toolchain: macos-15 + Xcode 26.3 (Swift 6). Avoids `macos-latest` drift.
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: FormaCore tests
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version && sw_vers
      - name: Unit tests
        run: swift test --parallel --force-resolved-versions

  app:
    name: macOS app build
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Build the Forma app product
        run: swift build --package-path FormaApp --product Forma --only-use-versions-from-resolved-file
        # The ADS pin check is wired into CI by the consumer change that adds
        # scripts/check_ads_pin.py; scheduling it here first would be a red job.

  # A development bundle, not a release artifact: ad-hoc signed, not notarized,
  # no Developer ID. It exists so "the app packages" is checked on every PR
  # instead of being discovered at release time.
  package:
    name: macOS app package
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and ad-hoc sign Forma.app
        run: sh scripts/build_app.sh
      - name: Verify the assembled bundle
        run: sh scripts/verify_app_bundle.sh build/Forma.app
      # A zip artifact does not preserve POSIX permissions, so the downloaded
      # bundle arrived without its executable bit and could not be launched. A
      # tarball keeps the modes *and* extracts to `Forma.app/…`, never a bare
      # `Contents/`.
      - name: Archive the bundle
        run: tar -czf build/Forma-app-adhoc.tar.gz -C build Forma.app
      - name: Upload the development bundle
        uses: actions/upload-artifact@v4
        with:
          name: Forma-app-adhoc
          path: build/Forma-app-adhoc.tar.gz
          if-no-files-found: error

  # The job the Batch 2A field run showed was missing: uploading a bundle that
  # crashes on launch looked exactly like a successful package job. This one
  # downloads the artifact the user would get, re-verifies it and starts it.
  launch-smoke:
    name: macOS app launch smoke
    needs: package
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download the development bundle
        uses: actions/download-artifact@v4
        with:
          name: Forma-app-adhoc
          path: artifact
      - name: Extract the artifact
        run: |
          ls -la artifact
          tar -xzf artifact/Forma-app-adhoc.tar.gz -C artifact
          test -d artifact/Forma.app || { echo "error: artifact does not contain Forma.app" >&2; exit 1; }
          test -x artifact/Forma.app/Contents/MacOS/Forma || { echo "error: executable bit lost" >&2; exit 1; }
      - name: Verify structure and strict signature
        run: sh scripts/verify_app_bundle.sh artifact/Forma.app
      - name: Launch and observe
        run: sh scripts/smoke_app.sh artifact/Forma.app
