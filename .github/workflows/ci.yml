name: CI

on:
  pull_request:
  push:
    branches: [dev, workbuddy/dev]

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workbuddy-alpha:
    name: WorkBuddy Expert Alpha & Deterministic Safety Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run WorkBuddy deterministic safety & package tests
        run: python3 -m unittest discover -s workbuddy/tests -v
      - name: Validate WorkBuddy Expert package & reproducible build
        run: python3 workbuddy/scripts/build_package.py --check

  test:
    name: FormaCore tests
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version && sw_vers
      - name: Unit tests
        run: swift test --parallel --force-resolved-versions

  app:
    name: macOS app build
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Build the Forma app product
        run: swift build --package-path FormaApp --product Forma --only-use-versions-from-resolved-file
