name: CI

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

# Fixed toolchain: macos-26 + Xcode 26.3 (Swift 6). Avoids `macos-latest` drift.
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: FormaCore tests
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version && sw_vers
      # Issue #149: the pin record and the gitlink must not drift apart. This is
      # a consistency check, not a gate redesign: no new job, no new required
      # status check, no pin upgrade. `--verify-upstream` fetches the pinned ADS
      # object by SHA; Skyline-Gazer/ADS is public, so the no-token runner can reach
      # it (verified on the DevBox with an unauthenticated `git fetch`).
      - name: ADS pin consistency
        run: python3 scripts/check_ads_pin.py --verify-upstream
      # Host-safety lint (#153 physical-run report): automation must never
      # write global appearance, delete unscoped preferences, remove user
      # saved state, or control the user's app by name.
      - name: Host-state safety lint
        run: sh scripts/check_host_safety.sh
      - name: Unit tests
        run: swift test --parallel --force-resolved-versions

  app:
    name: macOS app build
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Build the Forma app product
        run: swift build --package-path FormaApp --product Forma --only-use-versions-from-resolved-file
        # The ADS pin check runs in the `test` job (issue #149), once for the
        # whole workflow; this job stays focused on building the app product.

  # A development bundle, not a release artifact: ad-hoc signed, not notarized,
  # no Developer ID. It exists so "the app packages" is checked on every PR
  # instead of being discovered at release time.
  package:
    name: macOS app package
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and ad-hoc sign Forma.app
        run: sh scripts/build_app.sh
      - name: Verify the assembled bundle
        run: sh scripts/verify_app_bundle.sh build/Forma.app
      # A zip artifact does not preserve POSIX permissions, so the downloaded
      # bundle arrived without its executable bit and could not be launched. A
      # tarball keeps the modes *and* extracts to `Forma.app/…`, never a bare
      # `Contents/`.
      - name: Archive the bundle
        run: tar -czf build/Forma-app-adhoc.tar.gz -C build Forma.app
      - name: Upload the development bundle
        uses: actions/upload-artifact@v4
        with:
          name: Forma-app-adhoc
          path: build/Forma-app-adhoc.tar.gz
          if-no-files-found: error

  # The job the Batch 2A field run showed was missing: uploading a bundle that
  # crashes on launch looked exactly like a successful package job. This one
  # downloads the artifact the user would get, re-verifies it and starts it.
  launch-smoke:
    name: macOS app launch smoke
    needs: package
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download the development bundle
        uses: actions/download-artifact@v4
        with:
          name: Forma-app-adhoc
          path: artifact
      - name: Extract the artifact
        run: |
          ls -la artifact
          tar -xzf artifact/Forma-app-adhoc.tar.gz -C artifact
          test -d artifact/Forma.app || { echo "error: artifact does not contain Forma.app" >&2; exit 1; }
          test -x artifact/Forma.app/Contents/MacOS/Forma || { echo "error: executable bit lost" >&2; exit 1; }
      - name: Verify structure and strict signature
        run: sh scripts/verify_app_bundle.sh artifact/Forma.app
      # Files present is not the same as files readable: the field crash was a
      # bundle the runtime could not open.
      - name: Verify the artifact can open its resources
        run: |
          swift build --product FormaResourceCheck --force-resolved-versions
          BIN=$(swift build --product FormaResourceCheck --show-bin-path)
          "$BIN/FormaResourceCheck" artifact/Forma.app
      - name: Launch and observe
        run: sh scripts/smoke_app.sh artifact/Forma.app
      # M0-R2 #153: the window-size contract was only observable on a real
      # display; unit tests cannot see NSHostingController's contentMinSize.
      # This drives the actual window: default size, resize to the shell
      # floor, clamp below it, and area navigation at a stable width.
      # The runner is an ephemeral single-purpose VM: ci mode (state reset
      # through the exact whitelist) is authorized here and nowhere else.
      - name: Window geometry regression
        env:
          FORMA_SMOKE_MODE: ci
        run: sh scripts/smoke_geometry.sh artifact/Forma.app
