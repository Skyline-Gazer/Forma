name: CI

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  tests:
    name: Swift Package tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - run: swift test --force-resolved-versions

  build:
    name: macOS App build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - run: xcodebuild -project Forma.xcodeproj -scheme Forma -configuration Debug -destination 'platform=macOS' -clonedSourcePackagesDirPath .build/xcode-packages -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO build
